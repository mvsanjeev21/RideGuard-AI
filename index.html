<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RideGuard AI — Autonomous Women's Ride Safety</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #131c31;
      --bg-input: #0f172a;
      --border: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --blue: #3b82f6;
      --cyan: #22d3ee;
      --green: #10b981;
      --emerald: #34d399;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: radial-gradient(circle at top right, #13223f, var(--bg-main) 60%); color: var(--text-main); min-height: 100vh; }
    .hidden { display: none !important; }

    /* Redesigned COMPUTE 50 Login / Setup View */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.2), #070c16 68%);
    }
    .login-card {
      width: 100%;
      max-width: 540px;
      background: rgba(17, 25, 44, 0.9);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 28px 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
    }
    .login-header { text-align: center; margin-bottom: 18px; }
    .login-header h2 { font-size: 26px; font-weight: 700; color: #f8fafc; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .login-header h2 span { color: var(--blue); }
    .login-header p { font-size: 13px; color: #cbd5e1; margin-top: 6px; }

    .compute-banner {
      display: flex; align-items: flex-start; gap: 12px;
      background: rgba(37, 99, 235, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
    }
    .compute-banner .b-icon { font-size: 18px; margin-top: 1px; }
    .compute-banner .b-title { font-size: 13px; font-weight: 700; color: #60a5fa; margin-bottom: 3px; }
    .compute-banner .b-desc { font-size: 12px; color: #cbd5e1; line-height: 1.45; }
    .compute-banner code { background: rgba(15, 23, 42, 0.7); padding: 1px 5px; border-radius: 4px; color: #93c5fd; font-size: 11px; }

    .sec-title { font-size: 13px; font-weight: 700; color: #f1f5f9; display: flex; align-items: center; gap: 7px; margin: 16px 0 10px; }
    .sec-title.green { color: var(--emerald); margin-top: 20px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .loc-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }

    label { display: block; font-size: 12px; color: #cbd5e1; margin: 10px 0 5px; font-weight: 500; }
    input[type="text"], input[type="tel"], input[type="email"] {
      width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-input); color: var(--text-main); font-size: 13px; outline: none;
    }
    input:focus { border-color: var(--blue); }

    .btn-gps {
      background: #2563eb; color: #fff; border: none; border-radius: 10px;
      padding: 11px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: 0.2s;
    }
    .btn-gps:hover { background: #1d4ed8; }

    .gmaps-preview {
      margin-top: 10px; border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(59, 130, 246, 0.35); background: #090f1d;
    }
    .gmaps-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; font-size: 11px; color: #93c5fd; background: rgba(37, 99, 235, 0.12);
    }
    .gmaps-bar a { color: #38bdf8; text-decoration: none; font-weight: 600; }
    .gmaps-preview iframe { width: 100%; height: 120px; border: 0; display: block; }

    .btn {
      width: 100%; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-save-grad {
      background: linear-gradient(90deg, #0ea5e9, #2563eb);
      color: #fff; border: none; margin-top: 20px; padding: 13px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
    }
    .btn-save-grad:hover { opacity: 0.94; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); margin-top: 10px; }
    .btn-ghost:hover { color: #fff; border-color: var(--blue); }

    /* Main Dashboard Shell */
    .brand { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .brand span { color: var(--blue); }
    .dashboard { max-width: 1240px; margin: 0 auto; padding: 20px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .top-left { display: flex; flex-direction: column; gap: 10px; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.4px; width: fit-content;
      background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-pill.danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.5); }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
